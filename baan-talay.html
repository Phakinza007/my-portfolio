<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <!-- Sends /foo.html to /foo and /index.html to /, in the address bar as well
       as in the index. GitHub Pages serves both and cannot redirect, so canonical
       alone leaves the visitor looking at the URL we told Google not to use.
       Inline and in <head> on purpose: a deferred external script would run after
       the parse and the page would render, then jump. location.replace keeps it
       out of history, so Back still leaves the site. -->
  <script>(function(p){if(location.protocol!=='file:'&&/\.html$/.test(p)&&!/\/404\.html$/.test(p))location.replace((/\/index\.html$/.test(p)?p.slice(0,-10):p.slice(0,-5))+location.search+location.hash)})(location.pathname)</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BAAN TALAY หัวหิน — รีสอร์ต 24 ห้องติดหาดส่วนตัว จองตรงถูกกว่า</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <meta name="description" content="รีสอร์ตริมทะเลหัวหิน 24 ห้อง หาดส่วนตัว 200 เมตร ห้องพัก 4 แบบเริ่ม ฿2,400 ห้องอาหารซีฟู้ด สปา และ 2 สระ เช็คราคารายวันตามฤดูกาลและจองตรงได้ทันที">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://ph-akin.dev/baan-talay">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="th_TH">
  <meta property="og:title" content="BAAN TALAY หัวหิน — รีสอร์ต 24 ห้องติดหาดส่วนตัว">
  <meta property="og:description" content="รีสอร์ตริมทะเลหัวหิน 24 ห้อง หาดส่วนตัว 200 เมตร ห้องพัก 4 แบบเริ่ม ฿2,400 เช็คราคารายวันและจองตรงได้ทันที">
  <meta property="og:url" content="https://ph-akin.dev/baan-talay">
  <meta property="og:image" content="https://ph-akin.dev/assets/screenshots/showcase-baan-talay.jpg">
  <meta property="og:image:alt" content="ภาพหน้าเว็บ BAAN TALAY">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#2C3327">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=optional" rel="stylesheet">
  <link rel="stylesheet" href="assets/baan-talay.css?v=rooms-policy-spa">
  <script src="assets/analytics.js" defer></script>
</head>
<body>
<a class="bt-skip" href="#app" id="skip">ข้ามไปเนื้อหาหลัก</a>

<!-- Desktop bar. Below 900px the phone keeps the design's own chrome:
     logo and menu button drawn over the hero, back buttons on inner screens.
     Both this and the drawer are filled by assets/baan-talay.js, because
     every string in them exists in two languages. -->
<header class="bt-hd" id="hd"></header>
<div class="bt-drawer" id="drawer"></div>

<main id="app"></main>
<footer class="bt-foot" id="foot"></footer>

<!-- Sticky action bar — phones only; at 900px the panels beside each screen
     carry the same price and CTA, so the bar is display:none there. -->
<div class="bt-bar" id="bar" hidden></div>

<div class="bt-lb" id="lb" hidden role="dialog" aria-modal="true" aria-label="Gallery">
  <!-- 1x1 transparent placeholder: an <img> with no src counts as a broken
       image and never settles decode(). The real source is set on open. -->
  <img id="lb-img" alt="" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7">
  <p id="lb-cap"></p>
  <div class="bt-lb-ctrl">
    <button type="button" class="bt-icon" id="lb-prev" aria-label="Previous">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
    </button>
    <span class="bt-lb-count" id="lb-count"></span>
    <button type="button" class="bt-icon" id="lb-next" aria-label="Next">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg>
    </button>
  </div>
  <button type="button" class="bt-icon bt-lb-close" id="lb-close" aria-label="Close">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
  </button>
</div>

<!-- Deferred so it does not block the first paint. CLS is held at 0 by
     #app{min-height:100vh} in the stylesheet, which keeps the footer below
     the fold until the content arrives — reserving the space beats blocking. -->
<script src="assets/baan-talay.js?v=rooms-policy-spa" defer></script>
</body>
</html>
