# One-off reconnaissance of jobboard.fastwork.co.
#
# Manual only -- there is no schedule here on purpose. It exists to answer a
# question the scanner cannot be written without: how does that board actually
# serve its listings? See _tools/jobscan/recon.py for what it checks and why.
#
# It runs here rather than locally because the Claude Code sandbox's egress
# proxy refuses CONNECT to jobboard.fastwork.co (403), so the page could not be
# read from there at all.
#
# Run it from the Actions tab, then read the job log. Nothing is committed.
#
# The push trigger is here because `workflow_dispatch` only appears once the
# workflow exists on the default branch, and this one is still on its feature
# branch. Drop the push trigger when the branch merges.
name: jobscan recon

on:
  workflow_dispatch:
  push:
    branches:
      - claude/fastwork-job-scan-automation-exk99a
    paths:
      - .github/workflows/jobscan-recon.yml
      # The whole package, not just recon.py: the dry-run step below exercises
      # fetch/normalize/score too, and a change to those that is never run is
      # a change that is never checked.
      - _tools/jobscan/**
      # No `!` exclusion for the fixture this workflow writes back: adding one
      # was followed by a push to this very file that triggered no run at all,
      # and a trigger that silently stops firing is worse than the loop it was
      # guarding against. The [skip ci] in the fixture commit already stops
      # that loop, and has been observed doing so.

permissions:
  contents: write

jobs:
  recon:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Without this Python buffers stdout when it is not a tty, so a step that
      # gets killed on timeout produces an empty log -- which is exactly what
      # happened on the first run and cost the whole attempt.
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: |
          python -m pip install --quiet --upgrade pip
          pip install --quiet requests playwright
          python -m playwright install --with-deps chromium

      - name: Recon
        id: recon
        timeout-minutes: 6
        # Do not let a non-zero exit hide the output -- exit 2 (robots.txt
        # disallows) is a result worth reading, not a crash.
        run: |
          set +e
          python3 _tools/jobscan/recon.py
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Upload raw captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recon-output
          path: _recon_out/
          if-no-files-found: warn
          retention-days: 7

      # A dry run against the live API, with the payload committed back to this
      # branch. That fixture is what makes the scoring rules tunable offline:
      # without it the alternative is hand-writing sample records, which tunes
      # the rules against fiction. Dry run means no state written and nothing
      # notified.
      - name: Dry run + capture a real fixture
        if: steps.recon.outputs.exit_code == '0'
        run: |
          set -e
          python3 _tools/jobscan/scan.py --dry-run \
            --dump-fixture _tools/jobscan/fixtures/jobs.json

      - name: Commit the fixture
        if: steps.recon.outputs.exit_code == '0'
        run: |
          git config user.name  "Phakin"
          git config user.email "221497160+Phakinza007@users.noreply.github.com"
          git add _tools/jobscan/fixtures/jobs.json
          if git diff --cached --quiet; then
            echo "fixture unchanged"
          else
            git commit -q -m "jobscan: refresh the live fixture [skip ci]"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

      - name: Report exit code
        run: |
          code="${{ steps.recon.outputs.exit_code }}"
          echo "recon.py exited $code"
          case "$code" in
            0) echo "OK -- read the log above and pick a source for fetch.py" ;;
            2) echo "::error::robots.txt disallows /jobs. Stop here." ; exit 1 ;;
            3) echo "::error::could not fetch the page at all" ; exit 1 ;;
            *) echo "::error::unexpected exit $code" ; exit 1 ;;
          esac
