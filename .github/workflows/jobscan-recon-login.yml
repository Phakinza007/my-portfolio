# Can the scanner log in to Fastwork, and what does its apply form ask for?
#
# Manual only, and deliberately separate from jobscan-recon.yml: that one
# cleared the read-only path (/api/jobs needs no account at all). This asks a
# different and more sensitive question, and the answer may well be "no".
#
# See _tools/jobscan/recon_login.py for what it checks. The short version:
# if the login page carries a CAPTCHA, automated login is off the table and
# the script exits 4. That is the site declining, not an obstacle to route
# around, and the proposal drafting works without an account anyway.
#
# 🔴 This never submits a proposal. It opens the apply form and reads its
# fields; the submit control is never clicked. Applying for a job on someone's
# behalf by accident is not an undoable mistake.
#
# FASTWORK_EMAIL / FASTWORK_PASSWORD are read only if they exist. The first
# run is expected to have neither: sections 1-3 of the output are what decide
# whether asking for a password is worth doing at all.
name: jobscan recon login

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recon-login:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Same reason as jobscan-recon.yml: unbuffered, so a step killed on
      # timeout still shows how far it got.
      PYTHONUNBUFFERED: '1'
      FASTWORK_EMAIL: ${{ secrets.FASTWORK_EMAIL }}
      FASTWORK_PASSWORD: ${{ secrets.FASTWORK_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: |
          python -m pip install --quiet --upgrade pip
          pip install --quiet requests playwright
          python -m playwright install --with-deps chromium

      - name: Recon login
        id: recon
        timeout-minutes: 8
        # exit 4 (CAPTCHA found) is a finding, not a crash -- capture it
        # rather than letting the shell abort the job before the upload.
        run: |
          set +e
          python3 _tools/jobscan/recon_login.py
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Upload raw captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recon-login-output
          path: _recon_out/
          if-no-files-found: warn
          retention-days: 7

      - name: Report exit code
        run: |
          code="${{ steps.recon.outputs.exit_code }}"
          echo "recon_login.py exited $code"
          case "$code" in
            0) echo "OK -- read section 2 and 3 above before setting any secret" ;;
            2) echo "::error::robots.txt disallows the login path. Stop here." ; exit 1 ;;
            3) echo "::error::no login page could be fetched" ; exit 1 ;;
            4) echo "::warning::CAPTCHA found -- automated login is off the table, and that is a valid answer. Proposal drafting does not need it." ;;
            *) echo "::error::unexpected exit $code" ; exit 1 ;;
          esac
