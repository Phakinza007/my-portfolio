<svg xmlns="http://www.w3.org/2000/svg" width="351.3" height="219.6" viewBox="0 0 351.3 219.6" role="img" aria-labelledby="t d">
  <title id="t">BuildNest construction landing page preview</title>
  <desc id="d">Light construction landing page preview with a serif BuildNest wordmark, four navigation links, a gold quote button, a dark photographic hero holding a four line Thai headline and two calls to action, a translucent four step process panel, and the start of a four column services grid.</desc>
  <defs>
    <!-- Palette read off assets/construction-redesign.css: ink #123d45, paper #f8f7f3, gold #c9922f, hero base #082e36. -->
    <style>
      .paper { fill: #f8f7f3; }
      .white { fill: #ffffff; }
      .ink   { fill: #123d45; }
      .gold  { fill: #c9922f; }
      .glow  { fill: #e1b051; }
      .line  { fill: #dce1de; }
    </style>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0e282d"/>
      <stop offset="48%" stop-color="#21373b"/>
      <stop offset="100%" stop-color="#4d5a5c"/>
    </linearGradient>
    <pattern id="blueprint" width="25.86" height="25.86" patternUnits="userSpaceOnUse">
      <path d="M25.86 0H0V25.86" fill="none" stroke="#ffffff" stroke-width="0.35"/>
    </pattern>
    <linearGradient id="bpfade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="27%" stop-color="#000000"/>
      <stop offset="60%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <mask id="bpmask">
      <rect x="0" y="18.7" width="351.3" height="162.7" fill="url(#bpfade)"/>
    </mask>
  </defs>

  <rect class="paper" width="351.3" height="219.6"/>

  <!-- top bar: white, hairline rule, serif wordmark, four nav links, gold quote button -->
  <rect class="white" width="351.3" height="18.7"/>
  <rect x="0" y="18.2" width="351.3" height="0.5" fill="#dfe4e4"/>
  <text x="19.5" y="11.49" class="ink" font-family="Georgia, 'Times New Roman', serif" font-size="6.79" font-weight="600" textLength="31.4" lengthAdjust="spacingAndGlyphs">BuildNest</text>
  <g class="ink" opacity="0.3">
    <rect x="189.3" y="8.11" width="20.0" height="2" rx="0.9"/>
    <rect x="217.6" y="8.11" width="9.9" height="2" rx="0.9"/>
    <rect x="235.8" y="8.11" width="16.3" height="2" rx="0.9"/>
    <rect x="260.4" y="8.11" width="23.8" height="2" rx="0.9"/>
  </g>
  <rect class="gold" x="290.5" y="3.66" width="41.3" height="11.22" rx="0.5"/>
  <rect class="white" x="295.6" y="8.13" width="31.1" height="2.2" rx="1" opacity="0.92"/>

  <!-- hero: the photograph reads as a horizontal overlay gradient, dark under the copy, open at the right -->
  <rect x="0" y="18.7" width="351.3" height="162.7" fill="url(#hero)"/>
  <path d="M0 119.6L351.3 59.4V181.4H0Z" fill="#ffffff" opacity="0.08"/>
  <path d="M0 154.3L351.3 108.5V181.4H0Z" fill="#ffffff" opacity="0.05"/>
  <rect x="0" y="18.7" width="351.3" height="162.7" fill="url(#blueprint)" opacity="0.055" mask="url(#bpmask)"/>

  <!-- eyebrow: the 34px rule, then the tracked wordmark line -->
  <rect class="glow" x="19.5" y="37.27" width="8.29" height="0.5"/>
  <rect class="glow" x="30.25" y="36.77" width="70.14" height="1.5" rx="0.7" opacity="0.75"/>

  <!-- headline: four serif lines, the third a short orphan -->
  <g class="white" opacity="0.95">
    <rect x="19.5" y="48.45" width="112.0" height="12.6" rx="1"/>
    <rect x="19.5" y="69.46" width="126.4" height="12.6" rx="1"/>
    <rect x="19.5" y="90.49" width="27.0" height="12.6" rx="1"/>
    <rect x="19.5" y="111.52" width="119.5" height="12.6" rx="1"/>
  </g>

  <!-- body copy -->
  <g class="white" opacity="0.6">
    <rect x="19.5" y="135.50" width="121.7" height="2.2" rx="1"/>
    <rect x="19.5" y="142.06" width="85" height="2.2" rx="1"/>
  </g>

  <!-- gold primary button, underlined secondary link with its gold arrow -->
  <rect class="gold" x="19.5" y="154.98" width="41.3" height="11.22" rx="0.5"/>
  <rect class="white" x="24.6" y="159.49" width="31.1" height="2.2" rx="1" opacity="0.92"/>
  <rect class="white" x="67.2" y="158.83" width="13.3" height="2.2" rx="1" opacity="0.85"/>
  <rect class="white" x="67.2" y="163.9" width="19.9" height="0.5" opacity="0.6"/>
  <path d="M83.2 159.9h3.2M85.2 158.6l1.4 1.3-1.4 1.3" fill="none" stroke="#e1b051" stroke-width="0.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- four step process panel: translucent, hairline border, corner brackets -->
  <rect x="236.6" y="36.49" width="95.2" height="126.42" fill="#042b32" opacity="0.63"/>
  <rect x="236.6" y="36.49" width="95.2" height="126.42" fill="none" stroke="#e0efed" stroke-opacity="0.44" stroke-width="0.4"/>
  <path d="M234.4 43.59v-9.3h9.3M334 153.81v9.3h-9.3" fill="none" stroke="#e0efed" stroke-opacity="0.75" stroke-width="0.4"/>
  <rect class="glow" x="244.2" y="47.16" width="48.4" height="2.6" rx="1" opacity="0.95"/>
  <g fill="#e0efed" opacity="0.22">
    <rect x="244.2" y="83.41" width="79.7" height="0.35"/>
    <rect x="244.2" y="109.35" width="79.7" height="0.35"/>
    <rect x="244.2" y="135.30" width="79.7" height="0.35"/>
  </g>
  <g class="glow" font-family="Georgia, 'Times New Roman', serif" font-size="5.46">
    <text x="244.2" y="68.13">01</text>
    <text x="244.2" y="94.10">02</text>
    <text x="244.2" y="120.05">03</text>
    <text x="244.2" y="146.02">04</text>
  </g>
  <g class="white" opacity="0.92">
    <rect x="257.3" y="63.74" width="32.6" height="2.4" rx="1"/>
    <rect x="257.3" y="89.71" width="34.0" height="2.4" rx="1"/>
    <rect x="257.3" y="115.63" width="32.5" height="2.4" rx="1"/>
    <rect x="257.3" y="141.60" width="33.5" height="2.4" rx="1"/>
  </g>
  <g class="white" opacity="0.5">
    <rect x="257.3" y="70.55" width="65.5" height="1.5" rx="0.7"/>
    <rect x="257.3" y="75.62" width="15.3" height="1.5" rx="0.7"/>
    <rect x="257.3" y="96.51" width="62.8" height="1.5" rx="0.7"/>
    <rect x="257.3" y="101.58" width="6.0" height="1.5" rx="0.7"/>
    <rect x="257.3" y="122.46" width="65.1" height="1.5" rx="0.7"/>
    <rect x="257.3" y="127.53" width="6.1" height="1.5" rx="0.7"/>
    <rect x="257.3" y="148.44" width="56.6" height="1.5" rx="0.7"/>
  </g>

  <!-- services section begins: centred kicker, serif section title, top of the four column grid -->
  <rect class="paper" x="0" y="181.4" width="351.3" height="38.2"/>
  <rect class="gold" x="160.2" y="189.35" width="8.29" height="0.5"/>
  <rect class="gold" x="170.9" y="188.8" width="20.2" height="1.6" rx="0.7" opacity="0.85"/>
  <rect class="ink" x="122.9" y="192.95" width="105.4" height="7.3" rx="0.6"/>
  <g class="line">
    <rect x="19.5" y="210.4" width="312.3" height="0.5"/>
    <rect x="97.5" y="210.4" width="0.5" height="9.2"/>
    <rect x="175.5" y="210.4" width="0.5" height="9.2"/>
    <rect x="253.6" y="210.4" width="0.5" height="9.2"/>
  </g>
  <g class="gold">
    <rect x="26.5" y="215.3" width="6.5" height="1.6" rx="0.7"/>
    <rect x="104.5" y="215.3" width="6.5" height="1.6" rx="0.7"/>
    <rect x="182.6" y="215.3" width="6.5" height="1.6" rx="0.7"/>
    <rect x="260.6" y="215.3" width="6.5" height="1.6" rx="0.7"/>
  </g>
</svg>
